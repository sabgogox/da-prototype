<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DA 原型">
<meta name="theme-color" content="#0088bf">
<title>DA 完成柯打 – Usability test prototype</title>
<style>
:root{
  --stage:#e9ecee; --stage-ink:#5b6870;
  --header:#0088bf; --ink:#00121a; --subtle:rgba(0,18,26,.6); --subtlest:rgba(0,18,26,.38);
  --bg:#f7f8f8; --white:#fff; --yellow:#ffdd00; --red:#c41c43; --teal:#00aeb1;
  --line:rgba(0,18,26,.1); --hl-blue:#e5f3f9; --hl-red:#d61f49;
  --shadow9:0 3px 6px rgba(0,18,26,.09),0 5px 12px rgba(0,18,26,.06),0 2px 16px rgba(0,18,26,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --stage:#14181b; --stage-ink:#8b979e; color-scheme:dark; }
}
:root[data-theme="dark"]{ --stage:#14181b; --stage-ink:#8b979e; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
svg{display:block}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#phone{position:absolute;left:0;top:0;width:393px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink)}
#stage.framed #phone{border-radius:44px;box-shadow:0 0 0 10px #1d2327,0 30px 60px rgba(0,0,0,.25)}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--stage-ink);display:none}
#stage.framed .hint{display:block}

/* iPhone home-screen (full screen) mode: the real status bar and home indicator sit over the design's own */
:root.ios-sa{padding-top:0;padding-bottom:0}
.ios-sa .sb>*{opacity:0}
.ios-sa .home::after,.ios-sa .kbb::after{display:none}
/* ---------- screen shell ---------- */
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;animation:fadeIn .14s ease-out}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.top{background:var(--header);color:#fff}
.sb{height:54px;position:relative}
.sb-time{position:absolute;left:0;top:0;width:134px;height:54px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;letter-spacing:-.4px}
.sb-icons{position:absolute;right:26px;top:21px;display:flex;gap:6px;align-items:center}
.nav{height:56px;position:relative;display:flex;align-items:center;justify-content:center}
.nav .ic-l{position:absolute;left:0;top:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.nav .ic-r{position:absolute;right:0;top:0;height:56px;display:flex}
.nav .ic-r>*{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.nav-title{display:flex;align-items:center;gap:4px;font-weight:600;font-size:17px;letter-spacing:-.43px}
.t17{font-size:17px;line-height:24px;letter-spacing:-.43px}
.t20{font-size:20px;line-height:24px;letter-spacing:-.45px;font-weight:600}
.t14{font-size:14px;line-height:20px;letter-spacing:-.15px}
.b{font-weight:600}
.sub{color:var(--subtle)}

.redbar{background:var(--red);color:#fff;display:flex;align-items:center;gap:8px;padding:4px 16px;height:48px}
.contact{background:#fff;padding:16px;display:flex;flex-direction:column;gap:16px}
.contact-row{display:flex;align-items:center;justify-content:space-between}
.contact-l{display:flex;align-items:center;gap:8px}
.vdiv{width:1px;height:16px;background:var(--subtlest)}
.pax{display:flex;align-items:center;color:var(--subtle);padding-right:4px}
.callbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.callbtn span{width:38px;height:38px;border-radius:50%;background:var(--header);display:flex;align-items:center;justify-content:center;color:#fff}
.field{background:rgba(218,218,218,.3);border-radius:20px;padding:8px 12px;display:flex;align-items:center;gap:8px;color:var(--subtle);text-align:left;width:100%;white-space:nowrap;overflow:hidden}
.field span{overflow:hidden;text-overflow:ellipsis}
.gap6{height:6px}.gap8{height:8px}

.route{background:#fff}
.rrow{display:flex;gap:16px;padding:4px 16px;min-height:56px;align-items:stretch}
.rl{width:24px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rl .ln{flex:1;width:0;border-left:2px dotted rgba(0,18,26,.22);min-height:8px}
.rl .ln16{height:16px;flex:none}
.rm{flex:1;min-width:0;padding:16px 0;display:flex;flex-direction:column;justify-content:center;text-align:left}
.rr{width:24px;padding-top:16px}
.tapaddr{cursor:pointer}
.tapaddr:active .rm{opacity:.6}

.reqs{background:#fff;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.req{height:40px;display:flex;align-items:center;gap:16px}

/* footer */
.footer{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:var(--shadow9);overflow:hidden}
.footer.sq{border-radius:0}
.fhead{height:24px;display:flex;align-items:center;justify-content:center}
.handle{width:40px;height:4px;border-radius:8px;background:var(--line)}
.ftap{cursor:pointer}
.timerrow{height:48px;display:flex;align-items:center;justify-content:center;padding:4px 16px}
.teal{color:var(--teal);font-weight:600}
.pay{display:flex;align-items:center;padding:16px 16px 0}
.pay .l{flex:1;display:flex;gap:8px;align-items:center}
.btns{display:flex;gap:8px;padding:16px}
.pbtn{flex:1;background:var(--yellow);border-radius:999px;padding:16px;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;letter-spacing:-.43px;color:var(--ink);white-space:pre}
.pbtn:active{filter:brightness(.94)}
.sbtn{border:2px solid var(--header);color:var(--header);border-radius:999px;padding:16px 24px;font-weight:600;font-size:17px;letter-spacing:-.43px}
.sbtn:active{background:#e5f3f9}
.home{height:34px;position:relative}
.home::after{content:"";position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:100px;background:#000}
.grace{height:32px;background:#fff;position:relative;overflow:hidden}
.grace i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--yellow)}
.grace i.run{width:100%;transition:width 9s linear}

/* price rows */
.prow{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:56px}
.prow .m{flex:1;text-align:left}
.prow .v{color:var(--subtle)}
.prow.tall{min-height:76px}
.hr16{height:16px;display:flex;align-items:center;padding:0 16px}
.hr16 i{display:block;height:1px;width:100%;background:var(--line)}

/* overlay + sheet */
.dim{position:absolute;inset:0;background:rgba(0,18,26,.32);animation:dimIn .2s ease-out}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:var(--shadow9);animation:sheetUp .26s cubic-bezier(.2,.8,.2,1);touch-action:none}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet.closing{transform:translateY(100%);transition:transform .2s ease-in}
.dim.closing{opacity:0;transition:opacity .2s}
.sheet .pay{padding:16px}

/* popover */
.popwrap{position:absolute;inset:0}
.pop{position:absolute;left:50px;width:304px;background:rgba(255,255,255,.97);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 18px 50px rgba(0,0,0,.18);animation:popIn .16s ease-out;transform-origin:50% 0}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.pop::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-11px;border:11px solid transparent;border-top:0;border-bottom:10px solid rgba(255,255,255,.97)}
.pop.up{transform-origin:50% 100%}
.pop.up::before{top:auto;bottom:-9px;border-bottom:0;border-top:10px solid rgba(255,255,255,.97)}
.pop button{height:48px;border-radius:24px;background:rgba(120,120,128,.16);font-size:17px;letter-spacing:-.43px;color:#000}
.pop button:active{background:rgba(120,120,128,.28)}

/* snackbar */
.snack{position:absolute;left:8px;right:8px;height:36px;border-radius:6px;background:#5c686d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-size:15px;animation:popIn .16s ease-out;z-index:5}
.snack button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff}

/* start screen */
.seg{display:flex;border:1px solid #fff;border-radius:20px;overflow:hidden}
.seg span{height:30px;padding:5px 10px;font-size:14px;line-height:20px;font-weight:600;letter-spacing:-.15px}
.seg span.on{background:#fff;color:var(--header);border-radius:20px 0 0 20px}
.tabs{display:flex;align-items:flex-start;padding:0 16px 8px;height:40px}
.tab{display:flex;justify-content:center;align-items:center}
.tab span{padding:4px 16px;border-radius:999px;font-weight:600;font-size:17px;line-height:24px;letter-spacing:-.43px;display:flex;align-items:center;gap:4px}
.tab span.on{background:#fff;color:var(--header)}
.filterrow{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px}
.switch{width:52px;height:32px;border-radius:100px;border:2px solid var(--subtlest);background:rgba(0,18,26,.05);position:relative}
.switch i{position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--subtlest)}
.cards{padding:0 8px;display:flex;flex-direction:column;gap:7px}
.ocard{background:#fff;border-radius:8px;box-shadow:0 1px 1px rgba(0,18,26,.09),0 1px 1px rgba(0,18,26,.06),0 1px 3px rgba(0,18,26,.05);overflow:hidden;text-align:left;width:100%}
.ocard:active{background:#f1f5f7}
.otype{background:var(--hl-blue);height:24px;display:flex;align-items:center;padding:2px 8px;font-size:17px;line-height:24px;letter-spacing:-.43px}
.obody{padding:8px 16px}
.oroute{display:flex;align-items:center;gap:8px}
.oprice{display:flex;align-items:center;gap:8px}
.bnav{position:absolute;left:0;right:0;bottom:0;background:#fff;box-shadow:0 3px 3px rgba(0,18,26,.09),0 5px 6px rgba(0,18,26,.06),0 2px 8px rgba(0,18,26,.05)}
.bnav .row{display:flex;height:56px}
.bnav .row span{flex:1;display:flex;align-items:center;justify-content:center}

/* chat */
.chathead .nav{flex-direction:column}
.chathead .ttl{font-weight:600;font-size:15px;line-height:20px}
.chathead .st{font-size:15px;line-height:20px}
.chatbody{position:absolute;left:0;right:0;top:110px;background:#fff;overflow-y:auto;padding:13px 16px 16px}
.cnote{text-align:center;font-size:15px;line-height:20px;color:var(--subtle);margin-bottom:24px}
.msg{display:flex;justify-content:flex-end;align-items:flex-end;gap:8px;margin-bottom:24px}
.msg time{font-size:14px;line-height:20px;color:var(--subtle)}
.bub{position:relative;background:var(--header);color:#fff;border-radius:8px 0 8px 8px;padding:8px 12px;font-size:17px;line-height:24px;letter-spacing:-.43px;max-width:256px;text-align:left;margin-right:8px}
.bub::after{content:"";position:absolute;right:-8px;top:0;border-top:8px solid var(--header);border-right:8px solid transparent}
.chatfoot{position:absolute;left:0;right:0;bottom:0;background:#fff}
.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid rgba(0,18,26,.38);border-radius:20px;padding:5px 9px;font-size:17px;line-height:24px}
.chips button:active{background:#e5f3f9}
.cfield{display:flex;align-items:center;gap:12px;padding:8px 16px 12px}
.cfield .in{flex:1;background:#f1f3f3;border-radius:20px;padding:8px 14px;font-size:17px;line-height:24px;letter-spacing:-.43px;min-height:40px;text-align:left}
.cfield .in.ph{color:var(--subtle)}
.kb{background:#d1d4db;padding:8px 3px 0}
.kr{display:flex;justify-content:center;gap:6px;margin-bottom:11px}
.k{height:43px;min-width:32px;flex:0 0 32.5px;background:#fff;border-radius:5px;box-shadow:0 1px 0 #898a8d;display:flex;align-items:center;justify-content:center;font-size:22px}
.k.g{background:#acb0ba;flex:0 0 43px}
.k.w{flex:0 0 88px;font-size:16px;background:#acb0ba}
.k.sp{flex:1;font-size:16px}
.kbb{height:78px;display:flex;justify-content:space-between;padding:12px 26px 0;position:relative}
.kbb::after{content:"";position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:100px;background:#000}

/* call */
.call{background:linear-gradient(180deg,#43535b 0%,#222c31 55%,#12181b 100%);color:#fff}
.call .who{position:absolute;left:0;right:0;top:120px;text-align:center}
.call .who h2{margin:0;font-weight:400;font-size:34px;letter-spacing:.3px}
.call .who p{margin:8px 0 0;font-size:17px;opacity:.75;font-variant-numeric:tabular-nums}
.cgrid{position:absolute;left:44px;right:44px;bottom:210px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:26px;justify-items:center}
.cgrid div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;opacity:.95}
.cgrid span{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.hang{position:absolute;left:50%;bottom:80px;width:76px;height:76px;margin-left:-38px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center}
.hang:active{filter:brightness(.88)}

/* map */
.map svg.m{position:absolute;inset:0;width:100%;height:100%}
.mapback{position:absolute;right:12px;top:62px;height:40px;padding:0 14px 0 10px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600;color:#007aff}
.mapback:active{background:#eef3f8}
.mapcard{position:absolute;left:8px;right:8px;bottom:12px;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.16);padding:16px 16px 14px}
.mapcard .app{font-size:13px;color:var(--subtle);margin-bottom:4px}
.mapcard h3{margin:0;font-size:20px;line-height:26px;letter-spacing:-.4px}
.mapcard .eta{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.mapcard .go{background:#34c759;color:#fff;border-radius:12px;padding:10px 22px;font-weight:600;font-size:17px}
.mapsb{color:#000}

/* price / payment flow */
.link{color:var(--header)}
.vphead{height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.vphead .l1{font-size:20px;line-height:32px}
.vpamt{font-size:24px;line-height:32px;font-weight:600}
.vplist{background:#fff;padding:8px 0}
.sec{padding:8px 16px;font-size:14px;line-height:20px;letter-spacing:-.15px;color:var(--subtle)}
.ascroll{position:absolute;left:0;right:0;top:110px;bottom:126px;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
.asec{background:#fff;margin-bottom:8px}
.asec h4{margin:0;padding:16px 16px 8px;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.43px}
.amt{color:var(--header);font-size:17px;letter-spacing:-.43px;margin-right:12px}
.xb{display:flex;width:24px;height:24px;align-items:center;justify-content:center}
.arow.tap{cursor:pointer}.arow.tap:active{background:#f3f5f6}
.wsheet{padding:0}
.whead{padding:16px 16px 0}
.wtitle{display:flex;align-items:center;justify-content:space-between}
.wtitle .t20{font-size:20px}
.wfield{padding:24px 16px 16px}
.wfield label{display:block}
.wfield input{width:100%;border:0;border-bottom:1px solid var(--line);font:inherit;font-size:17px;line-height:24px;padding:4px 0 8px;color:var(--ink);background:transparent;outline:none;border-radius:0;-webkit-user-select:text;user-select:text}
.wfield input::-webkit-outer-spin-button,.wfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wfield input{-moz-appearance:textfield;appearance:textfield}
.wfield input:focus{border-bottom-color:var(--header)}
.wsheet .btns{box-shadow:0 -1px 0 var(--line)}
.dlg{position:absolute;left:50%;top:50%;width:280px;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:24px 16px 16px;text-align:center;box-shadow:0 10px 40px rgba(0,18,26,.22);animation:dlgIn .18s ease-out;z-index:6}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.dlg h3{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.45px}
.dlg p{margin:8px 0 24px;font-size:17px;line-height:24px;letter-spacing:-.43px}
.dlg .col{display:flex;flex-direction:column;gap:12px}
.dlg .pbtn,.dlg .sbtn{width:100%;flex:none}
.dimfix{position:absolute;inset:0;background:rgba(0,18,26,.32);animation:dimIn .2s ease-out;z-index:5}
.pop.dotpop{left:83px;width:288px;padding:11px 8px;gap:10px;transform-origin:90% 0}
.pop.dotpop::before{left:auto;right:8px;margin-left:0}
.pop .red{color:#d61f49}
.fpsinfo{text-align:center;padding:2px 16px 20px;color:#fff}
.fr{font-size:17px;line-height:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.fpsamt{font-size:24px;line-height:30px;font-weight:700}
.fpsbody{position:absolute;left:0;right:0;bottom:0;background:#fff;text-align:center;padding:32px 40px 0}
.fpsbody p{margin:0 0 32px;font-size:17px;line-height:24px;color:var(--subtle)}
.fpsbody .qr{width:200px;height:200px;margin:0 auto}
</style>
</head>
<body>
<div id="stage">
  <div id="phone"><div id="app"></div></div>
  <div class="hint">Tap through the flow · triple-tap “9:41” to restart</div>
</div>

<script>
(() => {
'use strict';
/* =================== icons =================== */
const I = {

  bolt:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M14 2.5L5.5 13.6h5.8L9.8 21.5l8.7-11.6h-6L14 2.5z" fill="#fff"/></svg>',
  personW:'<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.5 19.5c0-3.6 3.4-5.8 7.5-5.8s7.5 2.2 7.5 5.8z"/></svg>',

/* =================== helpers =================== */
const $ = s => document.querySelector(s);
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const nowHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cdLeft = () => st.cdStart ? 900 - (Date.now()-st.cdStart)/1000 : 900;
const cuSec = () => st.cuStart ? (Date.now()-st.cuStart)/1000 : 0;
const waitMin = () => Math.max(1, Math.ceil(st.waitSec/60));

function qrSvg(){
  const N = 25, c = 8; let r = '', seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => (x >= 0 && x < 7 && y >= 0 && y < 7);
  const inF = (x, y) => finder(x, y) || finder(x - (N - 7), y) || finder(x, y - (N - 7));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (inF(x, y)) continue;
    if (rnd() < .48) r += `M${x*c} ${y*c}h${c}v${c}h-${c}z`;
  }
  const f = (x, y) => `M${x*c} ${y*c}h${7*c}v${7*c}h-${7*c}zM${(x+1)*c} ${(y+1)*c}v${5*c}h${5*c}v-${5*c}zM${(x+2)*c} ${(y+2)*c}h${3*c}v${3*c}h-${3*c}z`;
  return `<svg class="qr" viewBox="0 0 ${N*c} ${N*c}" shape-rendering="crispEdges"><path d="${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}" fill="#000" fill-rule="evenodd"/></svg>`;
}

  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, (e.touches[0].clientY - y0) / scale); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { sh.style.transition = ''; if (dy > 80) collapse(); else sh.style.transform = ''; y0 = null; });
}
function collapse(){
  const sh = $('#sheet'), dim = $('.dim');
  if (!sh) return;
  sh.classList.add('closing'); dim && dim.classList.add('closing');
  setTimeout(closeOverlays, 200);
}

function openPopover(row, addr){
  const scr = $('#app .screen');
  const pr = scr.getBoundingClientRect(), rr = row.getBoundingClientRect();
  const bottom = (rr.bottom - pr.top) / scale, top = (rr.top - pr.top) / scale;
  const h = 248, H = scr.offsetHeight;
  const below = bottom + 4 + h < H - 8;
  const y = below ? bottom + 4 : top - h - 4;
  scr.insertAdjacentHTML('beforeend', `<div class="popwrap" data-ov data-act="closepop">
    <div class="pop ${below ? '' : 'up'}" style="top:${y}px" data-addr="${addr}">
      <button data-act="map" data-app="Apple 地圖">以Apple地圖開放</button>
      <button data-act="map" data-app="Google 地圖">以Google地圖開放</button>
      <button data-act="map" data-app="高德地圖">以高德地圖開放</button>
      <button data-act="copyaddr">複製地址</button></div></div>`);
}

let snackT;
function snack(){
  const scr = $('#app .screen'); const old = scr.querySelector('.snack'); old && old.remove();
  const f = scr.querySelector('[data-footer]');
  const b = f ? f.offsetHeight + 12 : 40;
  scr.insertAdjacentHTML('beforeend', `<div class="snack" style="bottom:${b}px"><span>已複製</span><button data-act="snackx" aria-label="關閉">${I.x14}</button></div>`);
  clearTimeout(snackT); snackT = setTimeout(() => { const s = scr.querySelector('.snack'); s && s.remove(); }, 2500);
}

function dialog(html){
  $('#app .screen').insertAdjacentHTML('beforeend', `<div class="dimfix" data-ov></div><div class="dlg" data-ov>${html}</div>`);
}
function openDisableDrop(){
  dialog(`<h3>請先更新狀態為「到達上貨點」，即可複製或從地圖查看落貨地址</h3><p>請確保你已到達上貨點後，才更新柯打狀態</p>
    <div class="col"><button class="pbtn" data-act="closeOv">知道了</button><button class="sbtn" data-act="toTrip1">已到達上貨點</button></div>`);
}
function openDots(){
  $('#app .screen').insertAdjacentHTML('beforeend', `<div class="popwrap" data-ov data-act="closepop">
    <div class="pop dotpop" style="top:112px">
      <button data-act="restart">放柯打</button><button data-act="closepop">致電司機柯打專線</button>
      <button data-act="closepop">將客人列入黑名單</button><button data-act="restart" class="red">取消柯打</button></div></div>`);
}
function openWaitSheet(){
  const base = st.screen === 'amend' ? st.draft : st.price;
  const v = base.wait || (st.waitSec > 0 ? waitMin() : '');
  $('#app .screen').insertAdjacentHTML('beforeend', `<div class="dim" data-ov data-act="closeOv"></div>
  <div class="sheet wsheet" data-ov>
    <div class="whead"><div class="wtitle"><span class="t20">超時等候時間</span><button class="xb" data-act="closeOv" aria-label="關閉">${I.xDark}</button></div>
      <div class="t14 sub" style="margin-top:8px">$10 / 5 分鐘（不滿 5 分鐘按 5 分鐘計）</div></div>
    <div class="wfield"><label class="t14 sub" for="waitIn">等候時間 (分鐘)</label><input id="waitIn" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" value="${v}"></div>
    <div class="btns"><button class="pbtn" data-act="waitUpdate" id="waitBtn">更新($${waitFee(+v || 0)})</button></div><div class="home"></div></div>`);
  const inp = $('#waitIn'), btn = $('#waitBtn');
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 3);
    btn.textContent = `更新($${waitFee(parseInt(inp.value, 10) || 0)})`;
  });
}
function openDone(){
  const income = total(st.price) - 5;
  dialog(`<svg width="220" height="140" viewBox="0 0 220 140" style="margin:-8px auto 12px">
      <path d="M30 120c-22 0-26-30-4-36-6-26 26-38 40-22 8-28 52-34 66-8 16-16 48-6 46 20 24 2 26 40 2 46z" fill="#e6effa"/>
      <path d="M64 58h86l22 22v38H64z" fill="#1f4ea3"/><path d="M64 58l22-16h58l6 16z" fill="#26468f"/>
      <path d="M150 58h18l22 26v34h-40z" fill="#2a63c4"/><path d="M156 64h11l15 18h-26z" fill="#bfe1fb"/>
      <path d="M110 70l26 30M136 70l-26 30" stroke="#ffdd00" stroke-width="10" stroke-linecap="round"/>
      <rect x="68" y="66" width="30" height="20" rx="3" fill="#bfe1fb"/>
      <circle cx="84" cy="120" r="11" fill="#12233f"/><circle cx="84" cy="120" r="5" fill="#9fb3cc"/>
      <circle cx="166" cy="120" r="11" fill="#12233f"/><circle cx="166" cy="120" r="5" fill="#9fb3cc"/>
      <circle cx="122" cy="26" r="17" fill="#ffd21f" stroke="#e8a900" stroke-width="3"/><text x="122" y="33" text-anchor="middle" font-size="20" font-weight="800" fill="#c48700" font-family="Arial,sans-serif">G</text>
    </svg>
    <h3>已完成柯打！</h3><p style="margin-bottom:24px">今天達成<br>1支柯打<br>收入$${income}</p>
    <div class="col"><button class="pbtn" data-act="noop">為柯打評分</button><button class="sbtn" data-act="restart">繼續接柯打！</button></div>`);
}

/* =================== navigation =================== */
let graceT, callT;
function go(name){
  clearTimeout(graceT); clearTimeout(callT);
  const keep = st.screen === name && $('#scroller') ? $('#scroller').scrollTop : null;
  st.screen = name;
  $('#app').innerHTML = S[name]();
  if (keep !== null && $('#scroller')) $('#scroller').scrollTop = keep;
  if (name === 'picking'){
    const f = $('#graceFill');
    requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('run')));
    graceT = setTimeout(() => { if (st.screen === 'picking') go('arrivePickup'); }, 9000);
  }
  if (name === 'chat'){ const b = $('#chatbody'); b.style.bottom = document.querySelector('.chatfoot').offsetHeight + 'px'; b.scrollTop = b.scrollHeight; }
  if (name === 'call'){ st.callStart = null; callT = setTimeout(() => { st.callStart = Date.now(); }, 2200); }
  tick();
}
function sub(name){ st.ret = st.screen; go(name); }
function back(){ go(st.ret || 'start'); }

function tick(){
  document.querySelectorAll('[data-bind=cd]').forEach(n => n.textContent = mmss(Math.ceil(cdLeft())));
  document.querySelectorAll('[data-bind=cu]').forEach(n => n.textContent = mmss(cuSec()));
  const cl = document.querySelector('[data-bind=call]'); if (cl && st.callStart) cl.textContent = mmss((Date.now()-st.callStart)/1000);
}
setInterval(tick, 250);

/* =================== actions =================== */
let secretTaps = [];
const A = {
  toPicking: () => go('picking'),
  toStart: () => go('start'),
  toArrive: () => go('arrivePickup'),
  toTrip1: () => { st.cdStart = Date.now(); go('trip1'); },
  skipWait: () => { st.cuStart = Date.now(); go('trip2'); },
  toDropoff: () => { st.waitSec = st.screen === 'trip2' ? cuSec() : 0; go('dropoff'); },
  noop: () => {},
  close: () => { if (st.screen === 'picking') go('start'); else if (st.screen === 'summary') A.restart(); },
  copy: () => snack(),
  copyaddr: () => { closeOverlays(); snack(); },
  snackx: () => { const s = document.querySelector('.snack'); s && s.remove(); },
  call: () => sub('call'),
  hangup: () => back(),
  chat: () => { st.chatKey = PAGE[st.screen].chat; sub('chat'); },
  back: () => back(),
  chip: el => { st.chats[st.chatKey].draft = el.dataset.t; go('chat'); },
  send: () => { const c = st.chats[st.chatKey]; if (!c.draft) return; c.msgs.push({t:c.draft, time:nowHM()}); c.draft = ''; go('chat'); },
  expand: () => openSheet(),
  collapse: () => collapse(),
  addr: el => openPopover(el, el.dataset.addr),
  closepop: () => closeOverlays(),
  map: el => { const addr = el.closest('.pop').dataset.addr; closeOverlays(); st.map = {addr, app:el.dataset.app}; sub('map'); },
  disableDrop: () => openDisableDrop(),
  dots: () => openDots(),
  closeOv: () => closeOverlays(),
  toViewPrice: () => go('viewPrice'),
  vpClose: () => go('summary'),
  toAmend: () => { st.draft = {...st.price}; go('amend'); },
  amendClose: () => { st.draft = null; go('viewPrice'); },
  commitAmend: () => { st.price = {...st.draft}; st.draft = null; go('viewPrice'); },
  xItem: el => { const k = el.dataset.k; st.draft[k] = k === 'wait' ? 0 : false; go('amend'); },
  readd: el => { st.draft[el.dataset.k] = true; go('amend'); },
  waitSheet: () => openWaitSheet(),
  waitUpdate: () => {
    const m = parseInt($('#waitIn').value, 10) || 0;
    if (st.screen !== 'amend') st.draft = {...st.price};
    st.draft.wait = m; go('amend');
  },
  toFps: () => go('fps'),
  fpsClose: () => go('summary'),
  doneDlg: () => openDone(),
  restart: () => { reset(); go('start'); },
  secret: () => { const t = Date.now(); secretTaps = secretTaps.filter(x => t - x < 700); secretTaps.push(t); if (secretTaps.length >= 3){ secretTaps = []; reset(); go('start'); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // taps inside the popover box itself (not on a button) should not close it
  if (el.dataset.act === 'closepop' && e.target.closest('.pop') && !e.target.closest('button')) return;
  e.stopPropagation();
  const fn = A[el.dataset.act]; fn && fn(el);
});

/* =================== fit to device =================== */
let scale = 1;
function fit(){
  const stage = $('#stage'), phone = $('#phone');
  const W = stage.clientWidth, H = stage.clientHeight;
  const mobile = W < 520;
  stage.classList.toggle('framed', !mobile);
  let h;
  if (mobile){
    scale = W / 393; h = H / scale;
    if (h < 700){ h = 700; scale = H / 700; }
    if (h > 1000) h = 1000;
  } else {
    h = 852; scale = Math.min(1, (H - 70) / 852, (W - 40) / 393);
  }
  phone.style.height = h + 'px';
  phone.style.transform = `scale(${scale})`;
  const left = (W - 393 * scale) / 2, top = mobile ? (H - h * scale) / 2 : Math.max(16, (H - 36 - h * scale) / 2);
  phone.style.left = left + 'px'; phone.style.top = top + 'px';
}
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS && (navigator.standalone || matchMedia('(display-mode: standalone)').matches)) document.documentElement.classList.add('ios-sa');
// Android: first tap switches the browser to full screen
if (!isIOS && matchMedia('(pointer:coarse)').matches && document.documentElement.requestFullscreen) {
  document.addEventListener('pointerup', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(() => {});
  }, true);
}
window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', () => setTimeout(fit, 120));
fit();
go('start');
})();
</script>
